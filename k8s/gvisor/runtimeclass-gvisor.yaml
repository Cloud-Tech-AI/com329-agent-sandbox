# Pods with runtimeClassName: gvisor run under runsc instead of runc.
# The handler name must match the containerd runtime added by gvisor-installer.yaml.
# Pods using it are only scheduled on nodes labelled sandbox=gvisor.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
scheduling:
  nodeSelector:
    sandbox: gvisor
overhead:
  podFixed: # memory/CPU used by the sandbox itself (Sentry + Gofer)
    memory: 64Mi
    cpu: 50m
