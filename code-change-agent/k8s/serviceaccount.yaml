# Service account the pod runs as. It gives the pod AWS credentials for Bedrock,
# so no static AWS keys are needed in the Secret.
#
# Uses EKS Pod Identity: scripts/setup-aws.sh creates the IAM role
# code-change-agent-bedrock and associates it with this service account.
# (For IRSA instead, add the annotation
#   eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/code-change-agent-bedrock
# and make the role trust the cluster's OIDC provider.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: code-change-agent
